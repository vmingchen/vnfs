[package]
name = "vfsi-c"
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "C API for VFSI vectorized filesystem interfaces"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["filesystem", "vectorized", "ffi", "vfsi"]

[lib]
name = "vfsi_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
libc = "0.2"
libntirpc-sys = { workspace = true }
vfsi-sync = { workspace = true }
vfsi-nfs = { workspace = true }
vfsi-local = { workspace = true }
vnfs = { path = "../../crates/vnfs", version = "0.0.16", features = ["dummy"] }
vfsi-smb = { workspace = true, features = ["server-copy"] }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
tempfile = "3"
vfsi-sync = { workspace = true, features = ["test-support"] }

[package.metadata.docs.rs]
all-features = true
