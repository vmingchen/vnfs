[package]
name = "vnfs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
libntirpc-sys = { version = "0.3.2", features = ["fuzzing"] }
vfsi-nfs = { path = "../crates/vfsi-nfs", version = "0.1.14", features = ["fuzzing"] }

[[bin]]
name = "nfs_compound_response"
path = "fuzz_targets/nfs_compound_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nfs_attribute_list"
path = "fuzz_targets/nfs_attribute_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "libntirpc_rpc_xdr"
path = "fuzz_targets/libntirpc_rpc_xdr.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
