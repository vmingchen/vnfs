[workspace]
members = ["vnfs", "nfsv41-sys", "vfsi-c"]
resolver = "2"

[workspace.dependencies]
clap = { version = "4.5.17", features = ["derive"] }
libc = "0.2"
libntirpc-sys = "0.2.2"
nfsv41-sys = { path = "nfsv41-sys", version = "0.1.4" }
xdr-codec = "0.4.4"
xdrgen = "0.4.4"

[patch.crates-io]
libntirpc-sys = { path = "python/third_party/libntirpc-sys" }
