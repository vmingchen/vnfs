[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nfs4fs"
version = "0.1.0"
description = "fsspec filesystem backed by vectorized VFSI clients for NFS, SMB, and local files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
dependencies = ["fsspec"]

[project.optional-dependencies]
test = ["pytest"]
dev = ["black", "pytest"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.maturin]
module-name = "nfs4fs._native"
python-source = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
