[package]
name = "vfsi-sync"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Synchronous scalar and vectorized filesystem interfaces for VFSI"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["filesystem", "vectorized", "batch", "vfsi"]

[features]
default = []
test-support = []
test-faults = ["vfsi-core/test-faults"]

[dependencies]
libc = { workspace = true }
vfsi-core = { workspace = true }
