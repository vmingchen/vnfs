[package]
name = "vfsi-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Shared types, errors, paths, and capabilities for VFSI"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["filesystem", "vectorized", "vfsi"]

[features]
default = []
test-faults = []

[dependencies]
bitflags = "2.6"
libc = { workspace = true }

[dev-dependencies]
proptest = "1"
