[package]
name = "vfsi-nfs"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
license = "MIT OR Apache-2.0"
description = "NFSv4 backend for VFSI"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["nfs", "nfs4", "filesystem", "vectorized", "vfsi"]

[features]
default = ["ffi"]
ffi = ["dep:libc", "dep:libntirpc-sys", "dep:nfsv41-sys"]
server-copy = ["ffi"]
rpcsec-gss = ["ffi", "libntirpc-sys/rpcsec-gss"]
test-faults = ["vfsi-core/test-faults", "vfsi-sync/test-faults"]
fuzzing = ["ffi"]

[dependencies]
libc = { workspace = true, optional = true }
libntirpc-sys = { workspace = true, optional = true }
nfsv41-sys = { workspace = true, optional = true }
vfsi-core = { workspace = true }
vfsi-sync = { workspace = true }

[dev-dependencies]
proptest = "1"
vfsi-sync = { workspace = true, features = ["test-support"] }

[package.metadata.docs.rs]
all-features = true
