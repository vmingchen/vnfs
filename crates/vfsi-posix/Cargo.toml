[package]
name = "vfsi-posix"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "POSIX syscall executor and rooted filesystem backend for VFSI"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["filesystem", "vectorized", "posix", "vfsi"]

[features]
default = []
test-faults = ["vfsi-local/test-faults"]

[dependencies]
vfsi-core = { workspace = true }
vfsi-local = { workspace = true }
vfsi-sync = { workspace = true }

[dev-dependencies]
tempfile = "3"
