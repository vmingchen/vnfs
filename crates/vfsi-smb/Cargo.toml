[package]
name = "vfsi-smb"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "SMB2/3 backend for VFSI vectorized filesystem interfaces"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["smb", "smb2", "smb3", "filesystem", "vfsi"]

[features]
default = []
server-copy = []
test-faults = ["vfsi-core/test-faults", "vfsi-sync/test-faults"]

[dependencies]
futures-util = "0.3"
libc = { workspace = true }
smb2 = "0.21.0"
tokio = { version = "1", features = ["rt-multi-thread"] }
vfsi-core = { workspace = true }
vfsi-sync = { workspace = true }

[dev-dependencies]
proptest = "1"
vfsi-sync = { workspace = true, features = ["test-support"] }
