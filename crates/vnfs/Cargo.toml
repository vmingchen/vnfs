[package]
name = "vnfs"
version = "0.0.13"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Vectorized NFSv4 client and compatibility facade for VFSI"
readme = "README.md"
repository = "https://github.com/vmingchen/vnfs"
documentation = "https://docs.rs/vnfs"
keywords = ["nfs", "nfs4", "filesystem", "vectorized", "vfsi"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["nfs", "server-copy"]
nfs = ["dep:nfsv41-sys", "dep:vfsi-nfs"]
dummy = ["dep:vfsi-local"]
server-copy = ["vfsi-nfs?/server-copy"]
rpcsec-gss = ["nfs", "vfsi-nfs/rpcsec-gss"]
test-faults = [
    "vfsi-core/test-faults",
    "vfsi-sync/test-faults",
    "vfsi-nfs?/test-faults",
    "vfsi-local?/test-faults",
]

[dependencies]
libc = { workspace = true }
nfsv41-sys = { workspace = true, optional = true }
vfsi-core = { workspace = true }
vfsi-local = { workspace = true, optional = true }
vfsi-nfs = { workspace = true, optional = true }
vfsi-sync = { workspace = true }

[dev-dependencies]
vfsi-sync = { workspace = true, features = ["test-support"] }

[[test]]
name = "dummy_vecfs"
required-features = ["dummy"]
