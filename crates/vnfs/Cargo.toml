[package]
name = "vnfs"
version = "0.0.20"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Ergonomic scalar and vectorized NFSv4 client for Rust"
readme = "README.md"
repository = "https://github.com/vmingchen/vnfs"
documentation = "https://docs.rs/vnfs"
keywords = ["nfs", "nfs4", "filesystem", "vectorized", "vfsi"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["nfs", "server-copy", "auto"]
nfs = ["dep:nfsv41-sys", "dep:vfsi-nfs"]
dummy = ["dep:vfsi-local"]
uring = ["dep:vfsi-uring", "dep:vfsi-local"]
auto = ["nfs", "dummy"]
server-copy = ["vfsi-nfs?/server-copy"]
rpcsec-gss = ["nfs", "vfsi-nfs/rpcsec-gss"]
test-faults = [
    "vfsi-core/test-faults",
    "vfsi-sync/test-faults",
    "vfsi-nfs?/test-faults",
    "vfsi-local?/test-faults",
]

[dependencies]
bitfields = { workspace = true }
libc = { workspace = true }
nfsv41-sys = { workspace = true, optional = true }
vfsi-core = { workspace = true }
vfsi-local = { workspace = true, optional = true }
vfsi-nfs = { workspace = true, optional = true }
vfsi-sync = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
vfsi-uring = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
vfsi-sync = { workspace = true, features = ["test-support"] }

[[example]]
name = "uring_bench"
required-features = ["uring", "dummy"]

[[test]]
name = "dummy_vecfs"
required-features = ["dummy"]

[[test]]
name = "application_boundary"
required-features = ["auto"]

[[example]]
name = "demo"
required-features = ["nfs"]

[[example]]
name = "bulk_files"
required-features = ["nfs"]

[[example]]
name = "open_handles"
required-features = ["nfs"]

[[example]]
name = "stream_file"
required-features = ["nfs"]

[[example]]
name = "directories"
required-features = ["nfs"]

[[example]]
name = "small_files_benchmark"
required-features = ["nfs"]

[[example]]
name = "large_file_read_benchmark"
required-features = ["nfs"]
