[package]
name = "vfsi-local"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Shared local namespace, handles and execution interface for VFSI"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["filesystem", "vectorized", "local", "vfsi"]

[features]
default = []
test-faults = ["vfsi-core/test-faults", "vfsi-sync/test-faults"]

[dependencies]
libc = { workspace = true }
vfsi-core = { workspace = true }
vfsi-sync = { workspace = true }

[dev-dependencies]
proptest = "1"
vfsi-sync = { workspace = true, features = ["test-support"] }
