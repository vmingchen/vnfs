version: 2
updates:
  # Shared path dependencies span the root and detached native workspaces.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/adapters/nfs4fs"
      - "/adapters/vfsi-python"
      - "/adapters/vsmb"
      - "/fuzz"
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/adapters/nfs4fs"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/adapters/vfsi-fsspec"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/adapters/vsmb"
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: "/adapters/vsmbfs"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
