name: vsmbfs release

on:
  workflow_dispatch:
  push:
    tags:
      - "vsmbfs-v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify CI passed
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/verify-ci-run.sh CI "${{ github.sha }}"

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check tag and build distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade build twine
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            expected=${RELEASE_TAG#vsmbfs-v}
            actual=$(python -c \
              'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("adapters/vsmbfs/pyproject.toml").read_text())["project"]["version"])')
            test "$actual" = "$expected"
          fi
          python -m build --outdir adapters/vsmbfs/dist adapters/vsmbfs
          python -m twine check adapters/vsmbfs/dist/*
      - name: Test the installed wheel outside the source tree
        run: |
          python -m venv /tmp/vsmbfs-release
          /tmp/vsmbfs-release/bin/pip install \
            pytest adapters/vsmbfs/dist/*.whl
          cd /tmp
          /tmp/vsmbfs-release/bin/python -m pytest \
            "$GITHUB_WORKSPACE/adapters/vsmbfs/tests/test_package.py"
      - name: Generate a CycloneDX SBOM
        run: |
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install cyclonedx-bom==7.3.1
          python -m venv .sbom-runtime
          .sbom-runtime/bin/pip install 'fsspec>=2024.12.0'
          mkdir -p sbom
          .sbom-venv/bin/cyclonedx-py environment .sbom-runtime \
            --pyproject adapters/vsmbfs/pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom/vsmbfs.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsmbfs-dist
          path: adapters/vsmbfs/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsmbfs-sbom
          path: sbom/*.cdx.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vsmbfs-v')
    needs: [verify, build]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/vsmbfs/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsmbfs-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsmbfs-sbom
          path: sbom
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/attach-release-assets.sh sbom/*.cdx.json
