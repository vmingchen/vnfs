name: Bundled ntirpc

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source-built-client:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable
      - name: Install build dependencies without system ntirpc headers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libclang-dev pkg-config libkrb5-dev liburcu-dev
          test ! -e /usr/include/ntirpc/rpc/rpc.h
      - name: Verify packaged ntirpc and NFS codecs
        run: |
          ./scripts/test-libntirpc.sh
          cargo test -p nfsv41-sys
          cargo test -p vfsi-nfs --lib --all-features
      - name: Install independent NFS and Kerberos servers
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y krb5-admin-server krb5-kdc krb5-user \
            nfs-ganesha nfs-ganesha-vfs rpcbind
      - name: Exercise the source-built client with RPCSEC_GSS
        env:
          VNFS_GSS_SKIP_PYTHON: "1"
        run: ci/run-nfs-gss-integration.sh
