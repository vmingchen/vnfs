name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libntirpc-dev libkrb5-dev libgssglue-dev liburcu-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check the detached Python native crate
        run: |
          cargo fmt --manifest-path adapters/vfsi-python/Cargo.toml --check
          cargo clippy --manifest-path adapters/vfsi-python/Cargo.toml --all-features --all-targets -- -D warnings
          cargo fmt --manifest-path adapters/nfs4fs/Cargo.toml --check
          cargo clippy --manifest-path adapters/nfs4fs/Cargo.toml --locked --all-targets -- -D warnings
          cargo fmt --manifest-path adapters/vsmb/Cargo.toml --check
          cargo clippy --manifest-path adapters/vsmb/Cargo.toml --all-targets -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Verify docs.rs exposes the NFS client API
        run: |
          DOCS_RS=1 RUSTDOCFLAGS="-D warnings" \
            cargo doc -p vnfs -p vfsi-nfs --all-features --no-deps
          test -f target/doc/vnfs/struct.NfsVecFs.html
          test -f target/doc/vfsi_nfs/nfs/struct.NfsVecFs.html
      - name: Run every published Rust package's local tests
        run: |
          cargo test -p vfsi-core
          cargo test -p vfsi-sync
          cargo test -p vfsi-local
          cargo test -p vfsi-nfs --lib --all-features
          cargo test -p vfsi-smb --lib
          cargo test -p nfsv41-sys
          cargo test -p vnfs --lib
          cargo test -p vnfs --features dummy --test dummy_vecfs
          cargo test -p vnfs --test public_api
          cargo test -p vfsi-c --lib
      - name: Verify every published Rust package from coordinated crate archives
        run: |
          package_list=$(mktemp)
          cat >"$package_list" <<'PACKAGES'
          libntirpc-sys third-party/libntirpc-sys/Cargo.toml
          vfsi-core crates/vfsi-core/Cargo.toml
          vfsi-sync crates/vfsi-sync/Cargo.toml
          vfsi-local crates/vfsi-local/Cargo.toml
          vfsi-nfs crates/vfsi-nfs/Cargo.toml
          vfsi-smb crates/vfsi-smb/Cargo.toml
          nfsv41-sys crates/nfsv41-sys/Cargo.toml
          vnfs crates/vnfs/Cargo.toml
          vfsi-c bindings/c/Cargo.toml
          PACKAGES

          # Package the workspace as a unit so unpublished feature additions
          # in one member are available to dependent member manifests.
          cargo package --workspace --locked --no-verify

          patches=()
          while read -r package manifest; do
            version=$(python -c \
              'import pathlib,sys,tomllib; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["package"]["version"])' \
              "$manifest")
            tar -xzf "target/package/$package-$version.crate" -C target/package
            patches+=(--config \
              "patch.crates-io.$package.path=\"$GITHUB_WORKSPACE/target/package/$package-$version\"")
          done <"$package_list"

          # Compile each exact package archive against the exact archives of
          # its workspace peers. This catches missing packaged files and
          # cross-package API changes before dependent versions reach crates.io.
          while read -r package manifest; do
            version=$(python -c \
              'import pathlib,sys,tomllib; print(tomllib.loads(pathlib.Path(sys.argv[1]).read_text())["package"]["version"])' \
              "$manifest")
            archive_manifest="target/package/$package-$version/Cargo.toml"
            cargo "${patches[@]}" update --offline --manifest-path "$archive_manifest"
            if [ "$package" = vnfs ]; then
              # The NFS integration target requires the server jobs below.
              # Still compile and execute every server-independent test from
              # the exact crate archive here.
              cargo "${patches[@]}" test --locked --offline --manifest-path "$archive_manifest" --lib
              cargo "${patches[@]}" test --locked --offline --manifest-path "$archive_manifest" \
                --features dummy --test dummy_vecfs
              cargo "${patches[@]}" test --locked --offline --manifest-path "$archive_manifest" \
                --test public_api
            else
              cargo "${patches[@]}" test --locked --offline --manifest-path "$archive_manifest"
            fi
            if [ "$package" = vfsi-c ]; then
              archive="target/package/$package-$version"
              # vfsi-c's cbindgen build script invokes cargo metadata without
              # inheriting command-line patches, which normalizes Cargo.lock
              # while the test command is running. Reapply the coordinated
              # archive patches before the separate cdylib smoke build.
              cargo "${patches[@]}" update --offline --manifest-path "$archive/Cargo.toml"
              cargo "${patches[@]}" build --locked --offline --manifest-path "$archive/Cargo.toml"
              cc -Wall -Wextra -Werror \
                -I "$archive/include" "$archive/tests/smoke.c" \
                -L "$archive/target/debug" -lvfsi_c \
                -o /tmp/vfsi-packaged-c-smoke
              LD_LIBRARY_PATH="$archive/target/debug" \
                /tmp/vfsi-packaged-c-smoke /tmp/vfsi-packaged-c-root
            fi
          done <"$package_list"
      - name: Validate project organization registry
        run: |
          python ci/check-ecosystem.py
          python ci/check-package-metadata.py
      - name: Verify public Rust feature combinations
        run: |
          cargo check -p vfsi-nfs --no-default-features
          cargo check -p vfsi-nfs --all-features
          cargo check -p vnfs --no-default-features --features nfs
          cargo check -p vnfs --no-default-features --features nfs,rpcsec-gss
          cargo check -p vfsi-smb --no-default-features
          cargo check -p vfsi-smb --all-features
          cargo check -p vnfs --lib --no-default-features
          cargo check -p vnfs --lib --no-default-features --features dummy
          cargo check -p vnfs --lib --no-default-features --features nfs
      - name: Verify the documented Rust 1.88 MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check -p vnfs --all-targets --all-features
      - name: Verify vnfs has no SMB dependency
        run: |
          if cargo tree -p vnfs --edges normal --prefix none | \
              grep -Eq '^(vfsi-smb|smb2|tokio|futures-util) '; then
            echo "SMB dependencies must live in the vfsi-smb package" >&2
            exit 1
          fi
          if cargo tree -p vnfs --edges normal --prefix none | grep -Eq '^vfsi-local '; then
            echo "the local test backend must remain opt-in" >&2
            exit 1
          fi
      - name: Verify checked-in C header and smoke test
        run: |
          cargo build -p vfsi-c
          generated=$(find target/debug/build/vfsi-c-*/out -name vfsi.h -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          diff -u bindings/c/include/vfsi.h "$generated"
          cc -I bindings/c/include bindings/c/tests/smoke.c -L target/debug -lvfsi_c -o /tmp/vfsi-smoke
          LD_LIBRARY_PATH=target/debug /tmp/vfsi-smoke /tmp/vfsi-smoke-root

  python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            fsspec: "fsspec==2024.12.0"
          - python-version: "3.10"
            fsspec: "fsspec"
          - python-version: "3.11"
            fsspec: "fsspec"
          - python-version: "3.12"
            fsspec: "fsspec"
          - python-version: "3.13"
            fsspec: "fsspec"
          - python-version: "3.14"
            fsspec: "fsspec"
          - python-version: "3.14t"
            fsspec: "fsspec"
    name: python (${{ matrix.python-version }}, ${{ matrix.fsspec }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libntirpc-dev libkrb5-dev libgssglue-dev liburcu-dev
      - name: Build the current native extension before tests
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install hypothesis maturin '${{ matrix.fsspec }}' pytest
          .venv/bin/pip install -e adapters/vfsi-fsspec
          cd adapters/nfs4fs
          ../../.venv/bin/maturin develop
      - name: Test vfsi-fsspec and nfs4fs independently
        run: |
          .venv/bin/python -m pytest adapters/vfsi-fsspec/tests
          .venv/bin/python -m pytest adapters/nfs4fs/tests
      - name: Build and test the standalone SMB Python packages
        run: |
          .venv/bin/maturin develop --manifest-path adapters/vsmb/Cargo.toml
          .venv/bin/python -m pip install --no-deps -e adapters/vsmbfs
          .venv/bin/python -m pytest \
            adapters/vsmb/tests/test_client.py \
            adapters/vsmbfs/tests/test_package.py

  python-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libntirpc-dev libkrb5-dev libgssglue-dev liburcu-dev
      - name: Build and inspect wheel and source distribution
        run: |
          python -m pip install --upgrade pip build maturin patchelf twine
          python -m build --outdir adapters/vfsi-fsspec/dist adapters/vfsi-fsspec
          python -m build --outdir adapters/vsmbfs/dist adapters/vsmbfs
          python -m maturin build --manifest-path adapters/vsmb/Cargo.toml \
            --release --locked --compatibility pypi --out adapters/vsmb/dist
          python -m maturin sdist --manifest-path adapters/vsmb/Cargo.toml \
            --out adapters/vsmb/dist
          cd adapters/nfs4fs
          python -m maturin build --release --locked --compatibility pypi --out dist
          python -m maturin sdist --out dist
          python -m twine check \
            dist/* ../vfsi-fsspec/dist/* ../vsmb/dist/* ../vsmbfs/dist/*
      - name: Install wheel and test entry-point discovery outside the source tree
        run: |
          python -m venv .wheel-vfsi-fsspec
          .wheel-vfsi-fsspec/bin/pip install adapters/vfsi-fsspec/dist/*.whl
          python -m venv .wheel-nfs4fs
          .wheel-nfs4fs/bin/pip install \
            adapters/vfsi-fsspec/dist/*.whl adapters/nfs4fs/dist/*.whl
          python -m venv .wheel-vsmb
          .wheel-vsmb/bin/pip install adapters/vsmb/dist/*.whl
          python -m venv .wheel-vsmbfs
          .wheel-vsmbfs/bin/pip install \
            adapters/vfsi-fsspec/dist/*.whl adapters/vsmb/dist/*.whl \
            adapters/vsmbfs/dist/*.whl
          for environment in \
            .wheel-vfsi-fsspec .wheel-nfs4fs .wheel-vsmb .wheel-vsmbfs; do
            "$environment/bin/python" -m pip check
          done
          cd /tmp
          "$GITHUB_WORKSPACE/.wheel-vfsi-fsspec/bin/python" - <<'PY'
          import vfsi_fsspec

          assert vfsi_fsspec.VfsiFileSystem.protocol == "vfsi"
          PY
          "$GITHUB_WORKSPACE/.wheel-nfs4fs/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import pathlib
          import tempfile
          import tomllib

          import fsspec
          import vfsi

          metadata = importlib.metadata.metadata("nfs4fs")
          pyproject = pathlib.Path(
              os.environ["GITHUB_WORKSPACE"], "adapters", "nfs4fs", "pyproject.toml"
          )
          expected_version = tomllib.loads(pyproject.read_text())["project"]["version"]
          assert metadata["Version"] == expected_version
          assert metadata["Project-URL"]
          assert vfsi.VfsiFileSystem.protocol == "vfsi"
          assert fsspec.get_filesystem_class("nfs4").__module__ == "nfs4fs._fs"
          with tempfile.TemporaryDirectory() as root:
              fs = fsspec.filesystem("nfs4", backend="dummy", dummy_root=root)
              fs.pipe_file("/smoke", b"ok")
              assert fs.cat_file("/smoke") == b"ok"
          PY
          "$GITHUB_WORKSPACE/.wheel-vsmb/bin/python" - <<'PY'
          import importlib.metadata
          import vsmb

          assert vsmb.SmbClient
          assert not any(
              requirement.lower().startswith("fsspec")
              for requirement in (importlib.metadata.requires("vsmb") or [])
          )
          PY
          "$GITHUB_WORKSPACE/.wheel-vsmbfs/bin/python" - <<'PY'
          import fsspec
          import vsmbfs

          assert fsspec.get_filesystem_class("vsmbfs") is vsmbfs.VsmbFileSystem
          PY
      - name: Prove the source distribution can build a wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir /tmp/python-sdist-wheels \
            adapters/vfsi-fsspec/dist/*.tar.gz adapters/nfs4fs/dist/*.tar.gz \
            adapters/vsmb/dist/*.tar.gz adapters/vsmbfs/dist/*.tar.gz
          python -m venv .sdist-venv
          .sdist-venv/bin/pip install /tmp/python-sdist-wheels/*.whl
          .sdist-venv/bin/python -m pip check
          cd /tmp
          "$GITHUB_WORKSPACE/.sdist-venv/bin/python" - <<'PY'
          import tempfile

          import fsspec
          import nfs4fs
          import vfsi_fsspec
          import vsmb
          import vsmbfs

          assert vfsi_fsspec.VfsiFileSystem
          assert vsmb.SmbClient
          assert fsspec.get_filesystem_class("vsmbfs") is vsmbfs.VsmbFileSystem
          with tempfile.TemporaryDirectory() as root:
              fs = fsspec.filesystem("nfs4", backend="dummy", dummy_root=root)
              fs.pipe_file("/sdist-smoke", b"ok")
              assert fs.cat_file("/sdist-smoke") == b"ok"
              fs.close()
          PY
      - name: Type-check the installed public API
        run: |
          python -m venv .typecheck-venv
          .typecheck-venv/bin/pip install \
            adapters/vfsi-fsspec/dist/*.whl adapters/nfs4fs/dist/*.whl \
            adapters/vsmb/dist/*.whl adapters/vsmbfs/dist/*.whl \
            black==26.5.1 mypy==2.3.1 ruff==0.16.6
          .typecheck-venv/bin/black --check \
            adapters/vfsi-fsspec/python adapters/vfsi-fsspec/tests \
            adapters/nfs4fs/python adapters/nfs4fs/tests \
            adapters/vsmb/python adapters/vsmb/tests \
            adapters/vsmbfs/python adapters/vsmbfs/tests
          .typecheck-venv/bin/ruff check --config adapters/nfs4fs/pyproject.toml \
            adapters/vfsi-fsspec/python adapters/vfsi-fsspec/tests \
            adapters/nfs4fs/python adapters/nfs4fs/tests \
            adapters/vsmb/python adapters/vsmb/tests \
            adapters/vsmbfs/python adapters/vsmbfs/tests
          cd /tmp
          "$GITHUB_WORKSPACE/.typecheck-venv/bin/python" -m mypy --strict \
            "$GITHUB_WORKSPACE/adapters/vfsi-fsspec/tests/typecheck_api.py"
          "$GITHUB_WORKSPACE/.typecheck-venv/bin/python" -m mypy --strict \
            "$GITHUB_WORKSPACE/adapters/nfs4fs/tests/typecheck_api.py"
          "$GITHUB_WORKSPACE/.typecheck-venv/bin/python" -m mypy --strict \
            "$GITHUB_WORKSPACE/adapters/vsmb/tests/typecheck_api.py"
          "$GITHUB_WORKSPACE/.typecheck-venv/bin/python" -m mypy --strict \
            "$GITHUB_WORKSPACE/adapters/vsmbfs/tests/typecheck_api.py"

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo audit --file adapters/nfs4fs/Cargo.lock
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) cargo cyclonedx \
            --manifest-path adapters/nfs4fs/Cargo.toml \
            --format json \
            --override-filename nfs4fs-rust-sbom \
            --spec-version 1.5 \
            --all-features
      - name: Audit Python dependencies and create an SBOM
        run: |
          python -m venv .security-venv
          .security-venv/bin/pip install --upgrade pip \
            pip-audit==2.10.1 cyclonedx-bom==7.3.1
          .security-venv/bin/pip-audit --strict \
            --requirement adapters/nfs4fs/requirements-audit.txt
          python -m venv .runtime-venv
          .runtime-venv/bin/pip install 'fsspec>=2024.12.0'
          .security-venv/bin/cyclonedx-py environment .runtime-venv \
            --pyproject adapters/nfs4fs/pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file nfs4fs-python-sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: security-sbom
          path: |
            nfs4fs-python-sbom.json
            adapters/nfs4fs/**/nfs4fs-rust-sbom.json
          if-no-files-found: error

  nfs-integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minor-version: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install NFS-Ganesha and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libntirpc-dev libkrb5-dev libgssglue-dev liburcu-dev nfs-ganesha nfs-ganesha-vfs
      - name: Start local NFSv4 server
        run: |
          sudo systemctl stop nfs-ganesha.service || true
          sudo pkill -TERM -x ganesha.nfsd || true
          for attempt in $(seq 1 30); do
            if ! pgrep -x ganesha.nfsd >/dev/null; then
              break
            fi
            sleep 1
          done
          if pgrep -x ganesha.nfsd >/dev/null; then
            echo "A pre-existing Ganesha process did not stop"
            exit 1
          fi
          sudo mkdir -p /srv/vnfs-ci/git /run/ganesha
          sudo chmod -R 0777 /srv/vnfs-ci
          cat >/tmp/ganesha.conf <<'EOF'
          NFS_Core_Param {
            Protocols = 4;
            # This test server is NFSv4-only. Disabling the legacy auxiliary
            # RPC services also avoids collisions with services preinstalled
            # on a reused GitHub runner.
            Enable_NLM = false;
            Enable_RQUOTA = false;
          }
          NFSV4 { Graceless = true; }
          EXPORT {
            Export_Id = 77;
            Path = /srv/vnfs-ci;
            Pseudo = /;
            Access_Type = RW;
            Squash = None;
            SecType = sys;
            Protocols = 4;
            Transports = TCP;
            FSAL { Name = VFS; }
          }
          EOF
          sudo ganesha.nfsd -F -L /tmp/ganesha.log -f /tmp/ganesha.conf &
          ganesha_pid=$!
          for attempt in $(seq 1 30); do
            if ! sudo kill -0 "$ganesha_pid" 2>/dev/null; then
              cat /tmp/ganesha.log
              exit 1
            fi
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/2049' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ganesha.log
          exit 1
      - name: Run NFS integration suite
        env:
          VNFS_TEST_MINOR: ${{ matrix.minor-version }}
        run: cargo test -p vnfs --features test-faults --test nfs
      - name: Run vfsi-nfs directly against NFS
        env:
          VFSI_NFS_REQUIRED: 1
          VFSI_NFS_SERVER: 127.0.0.1
          VFSI_NFS_MINOR: ${{ matrix.minor-version }}
        run: cargo test -p vfsi-nfs --features server-copy --test nfs -- --test-threads=1
      - name: Recover read-only work across an NFS server restart
        env:
          VNFS_TEST_MINOR: ${{ matrix.minor-version }}
        run: |
          control_dir=$(mktemp -d)
          VNFS_RECOVERY_CONTROL_DIR="$control_dir" \
            cargo test -p vnfs --test nfs_recovery -- --nocapture --test-threads=1 &
          test_pid=$!
          trap 'touch "$control_dir/continue"; kill "$test_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if [ -e "$control_dir/ready" ]; then
              break
            fi
            if ! kill -0 "$test_pid" 2>/dev/null; then
              wait "$test_pid"
            fi
            sleep 0.25
          done
          test -e "$control_dir/ready"

          sudo pkill -TERM -x ganesha.nfsd
          for attempt in $(seq 1 30); do
            if ! pgrep -x ganesha.nfsd >/dev/null; then
              break
            fi
            sleep 1
          done
          ! pgrep -x ganesha.nfsd >/dev/null

          sudo ganesha.nfsd -F -L /tmp/ganesha-restart.log -f /tmp/ganesha.conf &
          ganesha_pid=$!
          for attempt in $(seq 1 30); do
            if ! sudo kill -0 "$ganesha_pid" 2>/dev/null; then
              cat /tmp/ganesha-restart.log
              exit 1
            fi
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/2049' 2>/dev/null; then
              break
            fi
            sleep 1
          done
          timeout 1 bash -c '</dev/tcp/127.0.0.1/2049'
          touch "$control_dir/continue"
          wait "$test_pid"
          trap - EXIT
      - name: Run C ABI smoke test against NFS
        run: |
          cargo build -p vfsi-c
          cc -Wall -Wextra -Werror -I bindings/c/include bindings/c/tests/smoke.c -L target/debug -lvfsi_c -o /tmp/vfsi-smoke
          LD_LIBRARY_PATH=target/debug /tmp/vfsi-smoke --nfs 127.0.0.1 '${{ matrix.minor-version }}'
      - name: Run required Python/fsspec coverage against NFS
        env:
          VFSI_NFS_REQUIRED: 1
          VFSI_NFS_SERVER: 127.0.0.1
          VFSI_NFS_MINOR: ${{ matrix.minor-version }}
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin fsspec pytest
          .venv/bin/pip install -e adapters/vfsi-fsspec
          cd adapters/nfs4fs
          ../../.venv/bin/maturin develop
          ../../.venv/bin/python -m pytest \
            tests/test_nfs_integration.py \
            tests/test_behavior_parity.py \
            tests/test_fsspec_abstract.py \
            tests/test_callbacks.py::test_callback_smoke_on_network_backends \
            tests/test_listing_cache.py::test_listing_cache_smoke_on_network_backends \
            tests/test_file_buffering.py::test_file_buffering_smoke_on_network_backends
      - name: Show server log after failure
        if: failure()
        run: |
          cat /tmp/ganesha.log
          test ! -e /tmp/ganesha-restart.log || cat /tmp/ganesha-restart.log

  nfs-gss-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Kerberos, NFS-Ganesha, and build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config \
            libntirpc-dev libkrb5-dev libgssglue-dev liburcu-dev \
            krb5-admin-server krb5-kdc krb5-user \
            nfs-ganesha nfs-ganesha-vfs rpcbind
      - name: Exercise supported RPCSEC_GSS levels against a private test realm
        run: ci/run-nfs-gss-integration.sh

  nfs-server-copy-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libntirpc-dev libkrb5-dev libgssglue-dev liburcu-dev
      - name: Build patched NFS-Ganesha image
        run: docker build --tag vnfs-ganesha-copy:ci ci/nfs-ganesha
      - name: Start patched NFSv4.2 server
        run: |
          sudo mkdir -p /srv/vnfs-ci/git
          sudo chmod -R 0777 /srv/vnfs-ci
          docker run --detach \
            --name vnfs-ganesha-copy \
            --privileged \
            --network host \
            --mount type=bind,source=/srv/vnfs-ci,target=/export \
            vnfs-ganesha-copy:ci
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' vnfs-ganesha-copy)" != true ]; then
              docker logs vnfs-ganesha-copy
              exit 1
            fi
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/2049' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs vnfs-ganesha-copy
          exit 1
      - name: Require batched NFSv4.2 server-side COPY
        env:
          VNFS_TEST_MINOR: 2
          VNFS_TEST_REQUIRE_SERVER_COPY: 1
        run: cargo test -p vnfs --features test-faults --test nfs
      - name: Run vfsi-nfs directly against patched NFSv4.2
        env:
          VFSI_NFS_REQUIRED: 1
          VFSI_NFS_SERVER: 127.0.0.1
          VFSI_NFS_MINOR: 2
        run: cargo test -p vfsi-nfs --features server-copy --test nfs -- --test-threads=1
      - name: Require server-side COPY through the C ABI
        env:
          VFSI_REQUIRE_SERVER_COPY: 1
        run: |
          cargo build -p vfsi-c
          cc -Wall -Wextra -Werror -I bindings/c/include bindings/c/tests/smoke.c -L target/debug -lvfsi_c -o /tmp/vfsi-smoke
          LD_LIBRARY_PATH=target/debug /tmp/vfsi-smoke --nfs 127.0.0.1 2
      - name: Run required Python/fsspec coverage against patched NFSv4.2
        env:
          VFSI_NFS_REQUIRED: 1
          VFSI_NFS_REQUIRE_SERVER_COPY: 1
          VFSI_NFS_SERVER: 127.0.0.1
          VFSI_NFS_MINOR: 2
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin fsspec pytest
          .venv/bin/pip install -e adapters/vfsi-fsspec
          cd adapters/nfs4fs
          ../../.venv/bin/maturin develop
          ../../.venv/bin/python -m pytest \
            tests/test_nfs_integration.py \
            tests/test_behavior_parity.py \
            tests/test_fsspec_abstract.py \
            tests/test_callbacks.py::test_callback_smoke_on_network_backends \
            tests/test_listing_cache.py::test_listing_cache_smoke_on_network_backends \
            tests/test_file_buffering.py::test_file_buffering_smoke_on_network_backends
      - name: Show patched NFS-Ganesha log after failure
        if: failure()
        run: |
          if docker inspect vnfs-ganesha-copy >/dev/null 2>&1; then
            docker logs vnfs-ganesha-copy
          fi
      - name: Stop patched NFS-Ganesha
        if: always()
        run: docker rm --force vnfs-ganesha-copy 2>/dev/null || true

  smb-integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smb21-guest-no-copy
            min_protocol: SMB2_10
            max_protocol: SMB2_10
            dialect: "0x0210"
            username: ""
            password: ""
            guest_ok: "yes"
            force_user: nobody
            rust_features: ""
            server_copy: "0"
            reconnect: ""
            require_reconnect: "0"
            bindings: false
          - name: smb311-authenticated
            min_protocol: SMB3_11
            max_protocol: SMB3_11
            dialect: "0x0311"
            username: vfsi-ci
            password: vfsi-ci-password
            guest_ok: "no"
            force_user: vfsi-ci
            rust_features: "server-copy"
            server_copy: "1"
            reconnect: "sudo systemctl restart smbd"
            require_reconnect: "1"
            bindings: true
    name: smb-integration (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Samba and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake pkg-config libntirpc-dev libkrb5-dev libgssglue-dev liburcu-dev samba smbclient
      - name: Start a loopback-only test share
        env:
          SMB_MIN_PROTOCOL: ${{ matrix.min_protocol }}
          SMB_MAX_PROTOCOL: ${{ matrix.max_protocol }}
          SMB_GUEST_OK: ${{ matrix.guest_ok }}
          SMB_FORCE_USER: ${{ matrix.force_user }}
          SMB_USERNAME: ${{ matrix.username }}
          SMB_PASSWORD: ${{ matrix.password }}
        run: |
          if [ -n "$SMB_USERNAME" ]; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$SMB_USERNAME"
            printf '%s\n%s\n' "$SMB_PASSWORD" "$SMB_PASSWORD" | sudo smbpasswd -a -s "$SMB_USERNAME"
          fi
          sudo install -d -o "$SMB_FORCE_USER" -g nogroup -m 0777 /var/tmp/vfsi-smb-ci
          cat >/tmp/vfsi-smb.conf <<EOF
          [global]
             server role = standalone server
             workgroup = WORKGROUP
             security = user
             map to guest = Bad User
             server min protocol = $SMB_MIN_PROTOCOL
             server max protocol = $SMB_MAX_PROTOCOL
             interfaces = lo
             bind interfaces only = yes
             disable netbios = yes
             smb ports = 445
             logging = file
             log file = /tmp/smbd.log

          [vfsi-test]
             path = /var/tmp/vfsi-smb-ci
             read only = no
             guest ok = $SMB_GUEST_OK
             force user = $SMB_FORCE_USER
             create mask = 0666
             directory mask = 0777
          EOF
          sudo install -o root -g root -m 0644 /tmp/vfsi-smb.conf /etc/samba/smb.conf
          sudo testparm -s /etc/samba/smb.conf
          sudo systemctl restart smbd
          for attempt in $(seq 1 30); do
            if [ -n "$SMB_USERNAME" ]; then
              smbclient_args=(-U "$SMB_USERNAME%$SMB_PASSWORD")
            else
              smbclient_args=(-N)
            fi
            if smbclient "${smbclient_args[@]}" //127.0.0.1/vfsi-test -c ls; then
              exit 0
            fi
            sleep 1
          done
          sudo journalctl -u smbd --no-pager
          exit 1
      - name: Run SMB conformance and integration tests
        env:
          VFSI_SMB_SERVER: 127.0.0.1
          VFSI_SMB_SHARE: vfsi-test
          VFSI_SMB_USERNAME: ${{ matrix.username }}
          VFSI_SMB_PASSWORD: ${{ matrix.password }}
          VFSI_SMB_EXPECT_DIALECT: ${{ matrix.dialect }}
          VFSI_SMB_EXPECT_SERVER_COPY: ${{ matrix.server_copy }}
          VFSI_SMB_REQUIRED: 1
          VFSI_SMB_REQUIRE_RECONNECT: ${{ matrix.require_reconnect }}
          VFSI_SMB_RESTART_COMMAND: ${{ matrix.reconnect }}
        run: |
          rust_features="test-faults"
          if [ -n "${{ matrix.rust_features }}" ]; then
            rust_features="$rust_features,${{ matrix.rust_features }}"
          fi
          cargo test -p vfsi-smb --features "$rust_features" --test smb -- --test-threads=1
      - name: Run C ABI smoke test against Samba
        if: matrix.bindings
        run: |
          cargo build -p vfsi-c
          cc -Wall -Wextra -Werror -I bindings/c/include bindings/c/tests/smoke.c -L target/debug -lvfsi_c -o /tmp/vfsi-smoke
          LD_LIBRARY_PATH=target/debug /tmp/vfsi-smoke --smb 127.0.0.1 vfsi-test '${{ matrix.username }}' '${{ matrix.password }}' ''
      - name: Run Python/fsspec conformance test against Samba
        if: matrix.bindings
        env:
          VFSI_SMB_SERVER: 127.0.0.1
          VFSI_SMB_SHARE: vfsi-test
          VFSI_SMB_USERNAME: ${{ matrix.username }}
          VFSI_SMB_PASSWORD: ${{ matrix.password }}
          VFSI_SMB_REQUIRED: 1
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin fsspec pytest
          .venv/bin/pip install -e adapters/vfsi-fsspec
          cd adapters/vsmb
          ../../.venv/bin/maturin develop
          cd ../..
          .venv/bin/pip install --no-deps -e adapters/vsmbfs
          .venv/bin/python -m pytest adapters/vsmb/tests adapters/vsmbfs/tests
      - name: Show Samba log after failure
        if: failure()
        run: sudo journalctl -u smbd --no-pager
