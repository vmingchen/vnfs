name: vfsi-fsspec release

on:
  workflow_dispatch:
  push:
    tags:
      - "vfsi-fsspec-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check tag and build distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --upgrade build twine
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            expected=${RELEASE_TAG#vfsi-fsspec-v}
            actual=$(python -c \
              'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("adapters/vfsi-fsspec/pyproject.toml").read_text())["project"]["version"])')
            test "$actual" = "$expected"
          fi
          python -m build --outdir adapters/vfsi-fsspec/dist adapters/vfsi-fsspec
          python -m twine check adapters/vfsi-fsspec/dist/*
      - name: Test the installed wheel outside the source tree
        run: |
          python -m venv /tmp/vfsi-fsspec-release
          /tmp/vfsi-fsspec-release/bin/pip install \
            pytest adapters/vfsi-fsspec/dist/*.whl
          cd /tmp
          /tmp/vfsi-fsspec-release/bin/python -m pytest \
            "$GITHUB_WORKSPACE/adapters/vfsi-fsspec/tests"
      - uses: actions/upload-artifact@v4
        with:
          name: vfsi-fsspec-dist
          path: adapters/vfsi-fsspec/dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vfsi-fsspec-v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/vfsi-fsspec/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: vfsi-fsspec-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
