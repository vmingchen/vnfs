name: nfs4fs release

on:
  workflow_dispatch:
  push:
    tags:
      - "nfs4fs-v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify CI passed
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/verify-ci-run.sh CI "${{ github.sha }}"

  wheels:
    name: wheel (${{ matrix.target }}, ${{ matrix.wheel-kind }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            wheel-kind: abi3
            extra-args: "-i python3.9"
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            platform: linux/amd64
            image-arch: x86_64
            test-python: cp39-cp39
          - target: aarch64-unknown-linux-gnu
            wheel-kind: abi3
            extra-args: "-i python3.9"
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
            platform: linux/arm64
            image-arch: aarch64
            test-python: cp39-cp39
          - target: x86_64-unknown-linux-gnu
            wheel-kind: cp314t
            extra-args: "-i python3.14t"
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            platform: linux/amd64
            image-arch: x86_64
            test-python: cp314-cp314t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - name: Build the portable wheel
        env:
          RUSTFLAGS: "-L native=/usr/local/lib"
        uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          maturin-version: v1.14.1
          working-directory: adapters/nfs4fs
          target: ${{ matrix.target }}
          manylinux: "2_28"
          container: ${{ matrix.container }}
          before-script-linux: |
            dnf install -y epel-release
            /usr/bin/crb enable
            dnf install -y clang clang-devel cmake curl krb5-devel make pkgconf-pkg-config userspace-rcu-devel
            ntirpc_revision=24a7d5fca4c2e3e3cc8bb94bc301d8c2a40677a8
            curl --fail --location --silent --show-error \
              --output /tmp/ntirpc.tar.gz \
              "https://github.com/nfs-ganesha/ntirpc/archive/${ntirpc_revision}.tar.gz"
            echo "819beb7dad10fc0c76032847c23c54212877d0fe37af666e8ef60ddc02471046  /tmp/ntirpc.tar.gz" | sha256sum --check
            tar -xzf /tmp/ntirpc.tar.gz -C /tmp
            cmake \
              -S "/tmp/ntirpc-${ntirpc_revision}" \
              -B /tmp/ntirpc-build \
              -DUSE_LTTNG=OFF \
              -DUSE_MONITORING=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -DCMAKE_INSTALL_LIBDIR=lib
            cmake --build /tmp/ntirpc-build --target ntirpc --parallel
            cmake --install /tmp/ntirpc-build
            ldconfig
          args: --release --locked --compatibility pypi --out dist ${{ matrix.extra-args }}
      - name: Test the repaired wheel in its manylinux container
        env:
          MANYLINUX_PLATFORM: ${{ matrix.platform }}
          MANYLINUX_ARCH: ${{ matrix.image-arch }}
          TEST_PYTHON: ${{ matrix.test-python }}
        run: |
          docker run --rm --platform "$MANYLINUX_PLATFORM" \
            -e TEST_PYTHON \
            -v "$PWD:/io" \
            "quay.io/pypa/manylinux_2_28_${MANYLINUX_ARCH}" \
            /bin/bash -c '
              set -e
              py="/opt/python/${TEST_PYTHON}/bin/python"
              "$py" -m pip install /io/adapters/vfsi-fsspec /io/adapters/nfs4fs/dist/*.whl
              cd /tmp
              "$py" - <<"PY"
          import tempfile
          import fsspec
          import nfs4fs

          with tempfile.TemporaryDirectory() as root:
              with fsspec.filesystem(
                  "nfs4", backend="dummy", dummy_root=root,
                  skip_instance_cache=True,
              ) as fs:
                  fs.pipe_file("/smoke", b"wheel-ok")
                  assert fs.cat_file("/smoke") == b"wheel-ok"
          print(nfs4fs.__version__)
          PY
            '
      - name: Verify the wheel bundles the native NFS libraries
        run: python3 ci/check-wheel-bundling.py adapters/nfs4fs/dist/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.wheel-kind }}
          path: adapters/nfs4fs/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install maturin==1.14.1
      - run: python -m maturin sdist --manifest-path adapters/nfs4fs/Cargo.toml --out adapters/nfs4fs/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: adapters/nfs4fs/dist/*.tar.gz
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Generate Rust and Python CycloneDX SBOMs
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install cyclonedx-bom==7.3.1
          python -m venv .sbom-runtime
          .sbom-runtime/bin/pip install 'fsspec>=2024.12.0'
          mkdir -p sbom
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) cargo cyclonedx \
            --manifest-path adapters/nfs4fs/Cargo.toml \
            --format json \
            --override-filename nfs4fs-rust-sbom \
            --spec-version 1.5 \
            --all-features
          cp adapters/nfs4fs/nfs4fs-rust-sbom.json sbom/
          .sbom-venv/bin/cyclonedx-py environment .sbom-runtime \
            --pyproject adapters/nfs4fs/pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom/nfs4fs-python.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nfs4fs-sbom
          path: sbom/*.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/nfs4fs-v')
    needs: [verify, wheels, sdist, sbom]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/nfs4fs/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nfs4fs-sbom
          path: sbom
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib

          tag_version = os.environ["RELEASE_TAG"].removeprefix("nfs4fs-v")
          names = [path.name for path in pathlib.Path("dist").iterdir()]
          versions = {
              name.removeprefix("nfs4fs-").removesuffix(".tar.gz").split("-", 1)[0]
              for name in names
              if name.startswith("nfs4fs-")
          }
          if versions != {tag_version}:
              raise SystemExit(f"tag version {tag_version!r} != artifacts {versions!r}")
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/attach-release-assets.sh sbom/*.json
