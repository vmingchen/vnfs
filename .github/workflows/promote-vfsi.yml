name: Promote VFSI mirror

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full canonical commit SHA to promote
        required: true
        type: string
      tags:
        description: Optional comma-separated release tags to promote
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vfsi-mirror-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'vmingchen/vnfs'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: vfsi-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate canonical commit and CI
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTE_COMMIT: ${{ inputs.commit }}
        run: |
          case "$PROMOTE_COMMIT" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "commit must be a full lowercase Git SHA" >&2; exit 1 ;;
          esac
          git fetch origin main --tags
          git cat-file -e "$PROMOTE_COMMIT^{commit}"
          git merge-base --is-ancestor "$PROMOTE_COMMIT" origin/main
          success=$(gh run list --repo vmingchen/vnfs \
            --workflow ci.yml --branch main --event push \
            --commit "$PROMOTE_COMMIT" \
            --status completed \
            --json conclusion \
            --jq 'any(.[]; .conclusion == "success")')
          test "$success" = true
      - name: Promote approved commit and tags
        env:
          PROMOTE_COMMIT: ${{ inputs.commit }}
          PROMOTE_TAGS: ${{ inputs.tags }}
          GH_TOKEN: ${{ github.token }}
          VFSI_MIRROR_SSH_KEY: ${{ secrets.VFSI_MIRROR_SSH_KEY }}
        run: |
          test -n "$VFSI_MIRROR_SSH_KEY" || {
            echo 'Configure vfsi-publish/VFSI_MIRROR_SSH_KEY with the vfsi/vfsi write deploy key.' >&2
            exit 1
          }
          key=$(mktemp "$RUNNER_TEMP/vfsi-mirror-key.XXXXXX")
          hosts=$(mktemp "$RUNNER_TEMP/vfsi-mirror-hosts.XXXXXX")
          trap 'rm -f "$key" "$hosts"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$VFSI_MIRROR_SSH_KEY" >"$key"
          # Obtain GitHub's published host keys over authenticated HTTPS.
          gh api meta --jq '.ssh_keys[] | "github.com " + .' >"$hosts"
          test -s "$hosts"
          export GIT_SSH_COMMAND="ssh -i \"$key\" -o IdentitiesOnly=yes -o UserKnownHostsFile=\"$hosts\" -o StrictHostKeyChecking=yes"
          git remote add vfsi git@github.com:vfsi/vfsi.git
          # Authentication/network errors must not masquerade as an empty mirror.
          head=$(git ls-remote --heads vfsi refs/heads/main)
          if test -n "$head"; then
            git fetch vfsi main --no-tags
            git merge-base --is-ancestor vfsi/main "$PROMOTE_COMMIT"
          fi

          refs=("$PROMOTE_COMMIT:refs/heads/main")
          IFS=',' read -ra requested_tags <<<"$PROMOTE_TAGS"
          for raw_tag in "${requested_tags[@]}"; do
            tag=$(printf '%s' "$raw_tag" | xargs)
            test -z "$tag" && continue
            git check-ref-format "refs/tags/$tag"
            case "$tag" in
              vnfs-v*|nfs4fs-v*|vsmb-v*|vsmbfs-v*|vfsi-fsspec-v*|\
              nfsv41-sys-v*|vfsi-c-v*|vfsi-core-v*|vfsi-sync-v*|\
              vfsi-nfs-v*|vfsi-smb-v*|vfsi-local-v*|vfsi-posix-v*|vfsi-uring-v*) ;;
              *) echo "unsupported release tag: $tag" >&2; exit 1 ;;
            esac
            git rev-parse --verify "refs/tags/$tag"
            tag_commit=$(git rev-list -n 1 "refs/tags/$tag")
            git merge-base --is-ancestor "$tag_commit" "$PROMOTE_COMMIT"
            refs+=("refs/tags/$tag:refs/tags/$tag")
          done

          git push --atomic vfsi "${refs[@]}"
