name: vsmb release

on:
  workflow_dispatch:
  push:
    tags:
      - "vsmb-v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify CI passed
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/verify-ci-run.sh CI "${{ github.sha }}"

  wheels:
    name: wheel (${{ matrix.target }}, ${{ matrix.wheel-kind }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            wheel-kind: abi3
            extra-args: "-i python3.9"
            platform: linux/amd64
            image-arch: x86_64
            test-python: cp39-cp39
          - target: aarch64-unknown-linux-gnu
            wheel-kind: abi3
            extra-args: "-i python3.9"
            platform: linux/arm64
            image-arch: aarch64
            test-python: cp39-cp39
          - target: x86_64-unknown-linux-gnu
            wheel-kind: cp314t
            extra-args: "-i python3.14t"
            platform: linux/amd64
            image-arch: x86_64
            test-python: cp314-cp314t
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: matrix.target == 'aarch64-unknown-linux-gnu'
      - uses: PyO3/maturin-action@423a6347767a8b16e65c2a7a7042e4a921528da8 # v1
        with:
          command: build
          maturin-version: v1.14.1
          working-directory: adapters/vsmb
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --compatibility pypi --out dist ${{ matrix.extra-args }}
      - name: Test the wheel in its manylinux container
        env:
          MANYLINUX_PLATFORM: ${{ matrix.platform }}
          MANYLINUX_ARCH: ${{ matrix.image-arch }}
          TEST_PYTHON: ${{ matrix.test-python }}
        run: |
          docker run --rm --platform "$MANYLINUX_PLATFORM" \
            -e TEST_PYTHON \
            -v "$PWD:/io" \
            "quay.io/pypa/manylinux_2_28_${MANYLINUX_ARCH}" \
            /bin/bash -c '
              set -e
              py="/opt/python/${TEST_PYTHON}/bin/python"
              "$py" -m pip install pytest /io/adapters/vsmb/dist/*.whl
              cd /tmp
              "$py" -m pytest /io/adapters/vsmb/tests/test_client.py
            '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.wheel-kind }}
          path: adapters/vsmb/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install maturin==1.14.1 twine
      - run: python -m maturin sdist --manifest-path adapters/vsmb/Cargo.toml --out adapters/vsmb/dist
      - run: python -m twine check adapters/vsmb/dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdist
          path: adapters/vsmb/dist/*.tar.gz
          if-no-files-found: error

  sbom:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Generate a Rust CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          mkdir -p sbom
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) cargo cyclonedx \
            --manifest-path adapters/vsmb/Cargo.toml \
            --format json \
            --override-filename vsmb-rust-sbom \
            --spec-version 1.5 \
            --all-features
          cp adapters/vsmb/vsmb-rust-sbom.json sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsmb-sbom
          path: sbom/*.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vsmb-v')
    needs: [verify, wheels, sdist, sbom]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/vsmb/
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vsmb-sbom
          path: sbom
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          expected = os.environ["RELEASE_TAG"].removeprefix("vsmb-v")
          versions = {
              match.group(1)
              for path in pathlib.Path("dist").iterdir()
              if (match := re.match(r"vsmb-(.+?)(?:-|\.tar\.gz$)", path.name))
          }
          if versions != {expected}:
              raise SystemExit(f"tag version {expected!r} != artifacts {versions!r}")
          PY
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
      - name: Attach the SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/attach-release-assets.sh sbom/*.json
