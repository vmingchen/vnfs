name: vsmb release

on:
  workflow_dispatch:
  push:
    tags:
      - "vsmb-v*"

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.target }}, ${{ matrix.wheel-kind }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            wheel-kind: abi3
            extra-args: "-i python3.9"
            platform: linux/amd64
            image-arch: x86_64
            test-python: cp39-cp39
          - target: aarch64-unknown-linux-gnu
            wheel-kind: abi3
            extra-args: "-i python3.9"
            platform: linux/arm64
            image-arch: aarch64
            test-python: cp39-cp39
          - target: x86_64-unknown-linux-gnu
            wheel-kind: cp314t
            extra-args: "-i python3.14t"
            platform: linux/amd64
            image-arch: x86_64
            test-python: cp314-cp314t
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        if: matrix.target == 'aarch64-unknown-linux-gnu'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          maturin-version: v1.14.1
          working-directory: adapters/vsmb
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --locked --compatibility pypi --out dist ${{ matrix.extra-args }}
      - name: Test the wheel in its manylinux container
        env:
          MANYLINUX_PLATFORM: ${{ matrix.platform }}
          MANYLINUX_ARCH: ${{ matrix.image-arch }}
          TEST_PYTHON: ${{ matrix.test-python }}
        run: |
          docker run --rm --platform "$MANYLINUX_PLATFORM" \
            -e TEST_PYTHON \
            -v "$PWD:/io" \
            "quay.io/pypa/manylinux_2_28_${MANYLINUX_ARCH}" \
            /bin/bash -c '
              set -e
              py="/opt/python/${TEST_PYTHON}/bin/python"
              "$py" -m pip install pytest /io/adapters/vsmb/dist/*.whl
              cd /tmp
              "$py" -m pytest /io/adapters/vsmb/tests/test_client.py
            '
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}-${{ matrix.wheel-kind }}
          path: adapters/vsmb/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install maturin==1.14.1 twine
      - run: python -m maturin sdist --manifest-path adapters/vsmb/Cargo.toml --out adapters/vsmb/dist
      - run: python -m twine check adapters/vsmb/dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: adapters/vsmb/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/vsmb-v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/vsmb/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          expected = os.environ["RELEASE_TAG"].removeprefix("vsmb-v")
          versions = {
              match.group(1)
              for path in pathlib.Path("dist").iterdir()
              if (match := re.match(r"vsmb-(.+?)(?:-|\.tar\.gz$)", path.name))
          }
          if versions != {expected}:
              raise SystemExit(f"tag version {expected!r} != artifacts {versions!r}")
          PY
      - uses: pypa/gh-action-pypi-publish@release/v1
