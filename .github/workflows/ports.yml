name: Port compatibility

on:
  push:
    branches: [main]
    paths: &compatibility-paths
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "bindings/c/**"
      - "ecosystem/**"
      - "ci/ports/**"
      - "ci/check-ecosystem.py"
      - "ci/check-promotion.py"
      - "scripts/test-ci-scripts.py"
      - ".github/workflows/ci.yml"
      - ".github/workflows/ports.yml"
      - ".github/workflows/promote-vfsi.yml"
  pull_request:
    paths: *compatibility-paths
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    if: github.repository == 'vmingchen/vnfs'
    runs-on: ubuntu-26.04
    outputs:
      ports: ${{ steps.registry.outputs.ports }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: registry
        run: |
          python3 ci/check-ecosystem.py
          python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import json, tomllib
          with open('ecosystem/ports.toml', 'rb') as stream:
              registry = tomllib.load(stream)
          print('ports=' + json.dumps([c['id'] for c in registry['component']
                                      if c['kind'] == 'application-port']))
          PY
  abi-v3:
    needs: registry
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ports-abi
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config libkrb5-dev liburcu-dev
      - name: ABI v3 old-client and optional-symbol contracts
        run: |
          cargo build -p vfsi-c
          ci/ports/check-c-abi.sh target/debug/libvfsi_c.so
  ports:
    needs: registry
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.registry.outputs.ports) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ports-${{ matrix.id }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential clang cmake gawk \
            libacl1-dev libattr1-dev libclang-dev libkrb5-dev libssl-dev liburcu-dev \
            pkg-config python3-cmarkgfm gettext
      - name: Validate registry
        run: python ci/check-ecosystem.py
      - name: Build VFSI C ABI
        if: matrix.id == 'git' || matrix.id == 'rsync'
        run: cargo build -p vfsi-c
      - name: Resolve pinned component
        id: component
        env:
          COMPONENT_ID: ${{ matrix.id }}
        run: |
          python - <<'PY' >>"$GITHUB_OUTPUT"
          import os
          import tomllib

          with open("ecosystem/ports.toml", "rb") as stream:
              registry = tomllib.load(stream)
          component = next(
              item for item in registry["component"]
              if item["id"] == os.environ["COMPONENT_ID"]
          )
          print(f"repository={component['repository']}")
          print(f"revision={component['revision']}")
          print(f"test={component['compatibility_test']}")
          PY
      - name: Run compatibility test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          VFSI_INCLUDE: ${{ github.workspace }}/bindings/c/include
        run: |
          "${{ steps.component.outputs.test }}" \
            "${{ steps.component.outputs.repository }}" \
            "${{ steps.component.outputs.revision }}" "${{ matrix.id }}"
