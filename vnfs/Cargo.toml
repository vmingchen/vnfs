[package]
name = "vnfs"
version = "0.0.7"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Protocol-neutral vectorized filesystem API for NFS, SMB, and local files"
readme = "README.md"
repository = "https://github.com/vmingchen/vnfs"
documentation = "https://docs.rs/vnfs"
keywords = ["NFS", "SMB", "filesystem", "vectorized"]

[package.metadata.docs.rs]
# docs.rs builds crates offline, while the optional NFS FFI dependency builds
# libntirpc from a pinned upstream source revision. Document the portable Rust
# backends there; NFS remains part of normal/default builds.
no-default-features = true
features = ["smb", "dummy", "server-copy"]

[features]
default = ["nfs", "smb", "dummy", "server-copy"]
nfs = ["dep:libntirpc-sys", "dep:nfsv41-sys"]
smb = ["dep:futures-util", "dep:smb2", "dep:tokio"]
dummy = []
server-copy = []

[dependencies]
bitflags = "2.6"
futures-util = { version = "0.3", optional = true }
libc = { workspace = true }
libntirpc-sys = { workspace = true, optional = true }
nfsv41-sys = { workspace = true, optional = true }
smb2 = { version = "0.21.0", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
