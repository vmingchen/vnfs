# Vendored fork of `libntirpc-sys` shipped inside the VFSI workspace and
# consumed through the workspace `[patch.crates-io]` entry. It is deliberately
# NOT publishable: the upstream crate is `https://github.com/vmingchen/libntirpc-sys`
# and this copy carries VFSI-specific build probing and C ABI shims.
[package]
name = "libntirpc-sys"
version = "0.2.5"
edition = "2024"
rust-version = "1.88"
authors = ["Ming Chen <v.mingchen@gmail.com>"]
description = "Low-level bindings for the libntirpc library."
readme = "README.md"
license = "BSD-3-Clause"
repository = "https://github.com/vmingchen/libntirpc-sys"
keywords = [
    "xdr",
    "rpc",
    "tirpc",
    "ntirpc",
    "nfs",
]
publish = false
build = "build.rs"
links = "ntirpc"

# Everything is explicitly listed: no build-generated examples, tests, or
# binaries are picked up implicitly.
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[package.metadata.docs.rs]
all-features = true

[features]
default = []
fuzzing = []
rpcsec-gss = []

[lib]
name = "libntirpc_sys"
path = "src/lib.rs"

[[example]]
name = "hello_client"
path = "examples/hello_client.rs"

[[example]]
name = "hello_server"
path = "examples/hello_server.rs"

[dev-dependencies]
libc = "0.2"

[build-dependencies]
bindgen = "=0.73.2"
pkg-config = "0.3"
