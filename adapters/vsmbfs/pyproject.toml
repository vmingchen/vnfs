[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vsmbfs"
version = "0.1.0"
description = "fsspec filesystem backed by the vectorized vsmb client"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
authors = [{ name = "Ming Chen", email = "v.mingchen@gmail.com" }]
keywords = ["fsspec", "smb", "smb2", "smb3", "filesystem", "vectorized-io"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "fsspec>=2024.12.0",
  "vfsi-fsspec>=0.1,<0.2",
  "vsmb>=0.1,<0.2",
]

[project.urls]
Homepage = "https://github.com/vmingchen/vnfs"
Documentation = "https://github.com/vmingchen/vnfs/tree/main/adapters/vsmbfs"
Repository = "https://github.com/vmingchen/vnfs"
Issues = "https://github.com/vmingchen/vnfs/issues"
Changelog = "https://github.com/vmingchen/vnfs/blob/main/CHANGELOG.md"

[project.entry-points."fsspec.specs"]
vsmbfs = "vsmbfs:VsmbFileSystem"

[project.optional-dependencies]
test = ["pytest"]
dev = ["black", "build", "mypy", "pytest", "ruff", "twine"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
