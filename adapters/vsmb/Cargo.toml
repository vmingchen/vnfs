[package]
name = "vsmb-python"
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Python bindings for the vectorized VFSI SMB2/3 client"
homepage = "https://github.com/vmingchen/vnfs"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["python", "smb", "filesystem", "vfsi"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[workspace]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39", "abi3t"] }
vfsi-python-native = { path = "../vfsi-python", features = ["smb"] }
