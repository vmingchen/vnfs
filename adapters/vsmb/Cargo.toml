[package]
name = "vsmb-python"
version = "0.1.5"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Python bindings for the vectorized VFSI SMB2/3 client"
homepage = "https://github.com/vmingchen/vnfs"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["python", "smb", "filesystem", "vfsi"]

[lib]
name = "vsmb_native"
crate-type = ["cdylib"]

[workspace]

[dependencies]
pyo3 = { version = "0.30.1", features = ["extension-module", "abi3-py39", "abi3t"] }
vfsi-python-native = { path = "../vfsi-python", version = "0.1.6", features = ["smb"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
