# Build settings for the detached nfs4fs Cargo workspace only.
#
# The extension links libntirpc statically (vendored libntirpc-sys patch) so
# `import nfs4fs` works without LD_LIBRARY_PATH. crates/nfsv41-sys/build.rs checks
# this variable to switch from its default dynamic-link flags; the main
# workspace never sets it, so its behavior is unchanged.
[env]
VNFS_STATIC_NTIRPC = "1"
