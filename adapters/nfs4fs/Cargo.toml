[package]
name = "nfs4fs-python"
version = "0.3.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Python bindings for the vectorized VFSI NFSv4 client"
homepage = "https://github.com/vmingchen/vnfs"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["python", "nfs", "fsspec", "vfsi"]

[lib]
name = "_native"
crate-type = ["cdylib"]

# Detached workspace: `cargo build --workspace` at the repo root must not see
# this package (the python build is driven by maturin/pip from this directory).
[workspace]

[dependencies]
libc = "0.2"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39", "abi3t"] }
vfsi-python-native = { path = "../vfsi-python", features = ["nfs", "dummy"] }
# Direct dependency so the static libntirpc archive is also re-asserted at the
# end of the final link line (see ../../third-party/libntirpc-sys/build.rs).
libntirpc-sys = { path = "../../third-party/libntirpc-sys" }

[patch.crates-io]
libntirpc-sys = { path = "../../third-party/libntirpc-sys" }
