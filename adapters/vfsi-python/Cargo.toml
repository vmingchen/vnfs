[package]
name = "vfsi-python-native"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Shared native Python bindings for VFSI backends"
repository = "https://github.com/vmingchen/vnfs"
keywords = ["python", "filesystem", "fsspec", "vfsi"]
publish = false

[workspace]

[features]
default = []
nfs = ["dep:vfsi-nfs", "vfsi-nfs/server-copy"]
nfs-rpcsec-gss = ["nfs", "vfsi-nfs/rpcsec-gss"]
smb = ["dep:vfsi-smb"]
dummy = ["dep:vfsi-local"]

[dependencies]
libc = "0.2"
pyo3 = { version = "0.29", features = ["abi3-py39", "abi3t"] }
vfsi-core = { path = "../../crates/vfsi-core", version = "0.1.8" }
vfsi-local = { path = "../../crates/vfsi-local", version = "0.1.7", optional = true }
vfsi-nfs = { path = "../../crates/vfsi-nfs", version = "0.1.8", optional = true }
vfsi-sync = { path = "../../crates/vfsi-sync", version = "0.1.9" }
vfsi-smb = { path = "../../crates/vfsi-smb", version = "0.1.6", optional = true }
